name: Build and test
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Build and regression tests
        run: swift test
      - name: Release build
        run: swift build -c release
      - name: Validate packaging scripts
        run: zsh -n build.sh release.sh
