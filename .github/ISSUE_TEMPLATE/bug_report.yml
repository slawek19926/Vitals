name: Bug report
description: Report a reproducible problem in Vitals
title: "[Bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug. Please include enough detail to reproduce it.
  - type: input
    id: version
    attributes:
      label: Vitals version
      placeholder: e.g. 1.1.0.137
    validations:
      required: true
  - type: input
    id: macos
    attributes:
      label: macOS version
      placeholder: e.g. macOS 26.0
    validations:
      required: true
  - type: input
    id: hardware
    attributes:
      label: Mac model / Apple silicon
      placeholder: e.g. MacBook Pro 14-inch, M3 Pro
    validations:
      required: true
  - type: dropdown
    id: helper
    attributes:
      label: Privileged helper
      options:
        - Enabled
        - Disabled
        - I am not sure
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open ...
        2. Click ...
        3. Observe ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: textarea
    id: extra
    attributes:
      label: Screenshots, logs or additional context
      description: Please remove private information before posting.
