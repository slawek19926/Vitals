name: Feature request
description: Suggest an improvement or new capability for Vitals
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve?
      description: Describe the use case rather than only the proposed UI.
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
      description: Describe how you would like Vitals to handle it.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives or examples
      description: Links to comparable tools, screenshots or technical references are welcome.
  - type: input
    id: hardware
    attributes:
      label: Relevant Mac model / Apple silicon generation
      placeholder: Optional
